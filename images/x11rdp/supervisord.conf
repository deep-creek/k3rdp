[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

; Logs from every program go to the container stdout/stderr so `kubectl logs`
; shows the full X11 -> VNC -> RDP startup chain.

[program:xvfb]
priority=100
command=/usr/bin/Xvfb :%(ENV_DISPLAY_NUM)s -screen 0 %(ENV_SCREEN_GEOMETRY)s -dpi %(ENV_SCREEN_DPI)s -listen tcp -ac -noreset
autorestart=true
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Waits for Xvfb, launches openbox, then runs x11vnc in the foreground.
[program:desktop]
priority=200
command=/usr/local/bin/start-x11.sh
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; RDP front-end. Binds :3389 immediately; connects to x11vnc per RDP session
; via the libvnc.so module configured in /etc/xrdp/xrdp.ini.
[program:xrdp]
priority=300
command=/usr/sbin/xrdp --nodaemon
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
