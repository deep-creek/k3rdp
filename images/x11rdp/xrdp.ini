[Globals]
; Listen for RDP on all interfaces, port 3389.
port=3389
use_vsock=false
tcp_nodelay=true
tcp_keepalive=true
security_layer=negotiate
crypt_level=high
bitmap_compression=true
bitmap_cache=true
new_cursors=true
allow_channels=true

; Auto-select the "x11vnc" session below so the RDP client attaches to the
; shared display immediately with no session picker / login round-trip.
autorun=x11vnc
; Blank the extra dialogs for a no-friction dev experience.
hidelogwindow=true
enable_token_login=false

[Logging]
LogFile=/dev/stdout
LogLevel=INFO
EnableSyslog=false

; Direct VNC backend: connect to the x11vnc export of the shared Xvfb display.
; x11vnc runs with -nopw, so the username/password here are placeholders.
[x11vnc]
name=Shared Xvfb (x11vnc)
lib=libvnc.so
username=na
password=na
ip=127.0.0.1
port=5900
