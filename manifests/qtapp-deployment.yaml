apiVersion: apps/v1
kind: Deployment
metadata:
  name: qtapp
  namespace: k3rdp
  labels:
    app: qtapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qtapp
  template:
    metadata:
      labels:
        app: qtapp
    spec:
      containers:
        - name: qtapp
          image: k3rdp/qtapp:dev
          imagePullPolicy: IfNotPresent
          env:
            # Render into the shared display in the x11rdp pod, over TCP.
            - name: DISPLAY
              value: "x11rdp-display.k3rdp.svc.cluster.local:0"
            - name: QT_QPA_PLATFORM
              value: "xcb"
            # No global QT_FONT_DPI: let Qt read each monitor's DPI from RandR so
            # the 96 DPI primary and 120 DPI secondary scale independently.
            # (Qt6 enables high-DPI scaling unconditionally.) PassThrough keeps
            # the exact 1.25x factor for 120 DPI instead of rounding to 1x.
            - name: QT_SCALE_FACTOR_ROUNDING_POLICY
              value: "PassThrough"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
