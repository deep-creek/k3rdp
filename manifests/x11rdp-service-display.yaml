# Cluster-internal X11 display endpoint. The Qt app connects here over TCP via
# DISPLAY=x11rdp-display.k3rdp.svc.cluster.local:0  (X display :0 = TCP 6000).
apiVersion: v1
kind: Service
metadata:
  name: x11rdp-display
  namespace: k3rdp
  labels:
    app: x11rdp
spec:
  type: ClusterIP
  selector:
    app: x11rdp
  ports:
    - name: x11
      port: 6000
      targetPort: 6000
      protocol: TCP
